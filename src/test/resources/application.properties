# Tujuan: Menjalankan test otomatis tanpa bergantung pada layanan MySQL lokal.
# Terakhir diubah: 27 September 2026, 00:00 WIB
spring.datasource.url=jdbc:h2:mem:cinemax_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.mail.host=localhost
spring.security.oauth2.client.registration.google.client-id=dummy-test-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-test-client-secret
spring.security.oauth2.client.registration.google.scope=openid,profile,email
