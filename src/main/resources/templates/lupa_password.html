<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lupa Password — Cineplex</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
  <section class="auth-card" role="region" aria-label="Form Reset Password">
    <div style="text-align:center;margin-bottom:12px">
      <a class="brand" href="/"><span th:text="${appConfig != null ? #strings.toUpperCase(appConfig.namaBioskop) : CINEPLEX}">CINEPLEX</span></a>
      <h1>Reset Password</h1>
      <p class="muted">Masukkan email terdaftar kamu untuk menerima tautan instruksi pemulihan kata sandi.</p>
    </div>

    <form th:action="@{/forgot-password-process}" method="POST">
      <div class="field">
        <label for="email">Alamat Email</label>
        <input class="input" id="email" name="email" type="email" placeholder="nama@email.com" required autocomplete="email">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px">Kirim Tautan Reset</button>
    </form>

    <div style="text-align:center;margin-top:20px">
      <a class="btn btn-ghost" href="/login">← Kembali ke Halaman Masuk</a>
    </div>
  </section>
</body>
</html>
