<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password Baru — Cineplex</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth">
  <section class="auth-card" role="region" aria-label="Form Password Baru">
    <div style="text-align:center;margin-bottom:12px">
      <a class="brand" href="/"><span th:text="${appConfig != null ? #strings.toUpperCase(appConfig.namaBioskop) : CINEPLEX}">CINEPLEX</span></a>
      <h1>Password Baru</h1>
      <p class="muted">Silakan masukkan password baru untuk akun Anda.</p>
    </div>

    <form th:action="@{/reset-password-process}" method="POST">
      <input type="hidden" name="token" th:value="${token}">
      <div class="field">
        <label for="password">Password Baru</label>
        <input class="input" id="password" name="password" type="password" placeholder="Minimal 8 karakter" required autocomplete="new-password">
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:6px">Simpan Password</button>
    </form>
  </section>
</body>
</html>
