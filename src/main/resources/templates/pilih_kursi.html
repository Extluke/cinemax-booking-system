<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilih Kursi — Cineplex</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="user-shell">
  <header class="user-header">
    <a class="brand" href="/"><span th:text="${appConfig != null ? #strings.toUpperCase(appConfig.namaBioskop) : CINEPLEX}">CINEPLEX</span></a>
    <div style="text-align:center">
      <strong th:text="${jadwal.film.judul}">Midnight Signal</strong><br>
      <span class="muted" style="font-size:12px" th:text="${jadwal.studio.nama + ' · ' + #temporals.format(jadwal.waktuMulai, 'dd MMM yyyy HH:mm')}">Studio 1 · 19 Sep 2026</span>
    </div>
    <span class="badge badge-info">Langkah 2/3</span>
  </header>

  <main class="user-content seat-layout">
    <div class="page-head">
      <div>
        <h1>Pilih Kursi</h1>
        <p class="muted">Pilih kursi terbaik untuk pengalaman menontonmu.</p>
      </div>
    </div>

    <section class="card">
      <div class="seat-hint">← Geser layar untuk melihat posisi seluruh kursi →</div>
      <div class="seat-scroll-wrap">
        <div class="screen">LAYAR BIOSKOP</div>
        <div class="seat-grid" role="region" aria-label="Layout Kursi Bioskop">
          <i th:each="kursi : ${semuaKursi}" 
             th:class="'seat ' + 
                       (${kursi.tipe.name() == 'JALAN_SETAPAK'} ? 'walkway ' : '') + 
                       (${kursiTerisi.contains(kursi.kodeKursi)} ? 'occupied ' : '') + 
                       (${kursi.kelasKursi != null ? #strings.toLowerCase(kursi.kelasKursi.namaKelas) : ''})"
             th:classappend="${kursi.spanKolom != null && kursi.spanKolom > 1} ? ' sweetbox' : ''"
             th:style="${kursi.spanKolom != null && kursi.spanKolom > 1} ? 'grid-column: span ' + ${kursi.spanKolom} : ''"
             th:tabindex="${kursiTerisi.contains(kursi.kodeKursi) || kursi.tipe.name() == 'JALAN_SETAPAK'} ? '-1' : '0'"
             th:role="${kursi.tipe.name() == 'JALAN_SETAPAK'} ? '' : 'button'"
             th:aria-label="${kursi.tipe.name() == 'JALAN_SETAPAK'} ? '' : (${kursiTerisi.contains(kursi.kodeKursi)} ? 'Kursi ' + kursi.kodeKursi + ' Terisi' : 'Kursi ' + kursi.kodeKursi + ' Tersedia')"
             th:attr="data-kode-kursi=${kursi.kodeKursi}"></i>
        </div>
      </div>
    </section>
  </main>

  <!-- Sticky Bottom Checkout Bar with Mobile Support -->
  <aside class="checkout-bar" aria-label="Ringkasan Pesanan Kursi">
    <div class="legend">
      <span class="legend-item"><i class="swatch"></i> Reguler</span>
      <span class="legend-item"><i class="swatch sweet"></i> Sweetbox</span>
      <span class="legend-item"><i class="swatch premiere"></i> Premiere</span>
      <span class="legend-item"><i class="swatch empty"></i> Terisi</span>
      <span class="legend-item"><i class="swatch" style="background:var(--color-primary)"></i> Dipilih</span>
    </div>
    <div>
      <span class="warning-box">⏱ 09:59</span>
      <div style="text-align:right">
        <span class="muted" style="font-size:11px;display:block">Total Pembayaran</span>
        <strong>Rp70.000</strong>
      </div>
      <a class="btn btn-primary" href="/faktur">Lanjut Checkout →</a>
    </div>
  </aside>
  <script th:inline="javascript">
    /*<![CDATA[*/
    const jadwalId = /*[[${jadwal.id}]]*/ 0;
    const hargaKursi = /*[[${jadwal.harga}]]*/ 35000;
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfHeaderName = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    /*]]>*/
    
    document.addEventListener('DOMContentLoaded', () => {
      const seats = document.querySelectorAll('.seat[role="button"]:not(.occupied):not(.walkway)');
      const totalBayarEl = document.querySelector('.checkout-bar strong:last-child');
      const checkoutBtn = document.querySelector('.checkout-bar .btn-primary');
      
      let selectedSeats = [];
      
      const updateTotal = () => {
        const total = selectedSeats.length * hargaKursi;
        totalBayarEl.textContent = new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(total);
      };
      
      seats.forEach(seat => {
        seat.addEventListener('click', () => {
          seat.classList.toggle('selected');
          const kode = seat.getAttribute('data-kode-kursi');
          if (seat.classList.contains('selected')) {
            selectedSeats.push(kode);
          } else {
            selectedSeats = selectedSeats.filter(s => s !== kode);
          }
          updateTotal();
        });
      });
      
      checkoutBtn.addEventListener('click', (e) => {
        e.preventDefault();
        if (selectedSeats.length === 0) {
          alert('Silakan pilih minimal 1 kursi!');
          return;
        }
        
        checkoutBtn.textContent = 'Memproses...';
        checkoutBtn.style.pointerEvents = 'none';
        
        fetch('/api/payment/checkout', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            [csrfHeaderName]: csrfToken
          },
          body: JSON.stringify({
            jadwalId: jadwalId,
            kursiKode: selectedSeats
          })
        })
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            alert('Gagal: ' + data.error);
            checkoutBtn.textContent = 'Lanjut Checkout →';
            checkoutBtn.style.pointerEvents = 'auto';
          } else {
            window.location.href = '/faktur?transaksiId=' + data.transaksiId + '&token=' + data.paymentUrl;
          }
        })
        .catch(err => {
          alert('Terjadi kesalahan jaringan.');
          checkoutBtn.textContent = 'Lanjut Checkout →';
          checkoutBtn.style.pointerEvents = 'auto';
        });
      });
      
      updateTotal(); // initial state
    });
  </script>
</body>
</html>
