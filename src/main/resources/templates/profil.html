<!doctype html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${'Profil Saya | ' + appConfig.namaBioskop}">Profil Saya | Cinemax</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="user-shell">
  <header class="user-header">
    <a class="brand" href="/"><span th:text="${#strings.toUpperCase(appConfig.namaBioskop)}">CINEMAX</span></a>
    <nav class="user-nav">
      <a href="/">Beranda</a>
      <a href="/jelajah">Film</a>
      <a href="/daftar-tiket">Tiket Saya</a>
    </nav>
    <div class="toolbar">
      <form method="post" th:action="@{/logout}">
        <button class="btn btn-secondary" type="submit">Keluar</button>
      </form>
    </div>
  </header>

  <main class="user-content">
    <section class="auth-card">
      <div class="profile-summary">
        <div class="avatar" th:text="${userInitials}">US</div>
        <div>
          <h2 th:text="${currentUser != null ? currentUser.namaLengkap : 'Pengguna'}">Pengguna</h2>
          <span class="badge badge-success" th:text="${currentUser != null ? currentUser.role : 'MEMBER'}">MEMBER</span>
        </div>
      </div>

      <h1>Pengaturan Akun</h1>
      <p class="muted">Perubahan profil akan tersedia pada pembaruan akun berikutnya.</p>
      <div th:if="${param.success}" class="badge badge-success" style="display:block; text-align:center; margin-bottom: 16px; padding: 12px;">Profil berhasil diperbarui.</div>
      <form th:action="@{/edit-profil}" method="post">
        <div class="field">
          <label>Nama Lengkap</label>
          <input class="input" name="namaLengkap" required th:value="${currentUser != null ? currentUser.namaLengkap : ''}" type="text">
        </div>
        <div class="field">
          <label>Email (Tidak Dapat Diubah)</label>
          <input class="input" readonly th:value="${currentUser != null ? currentUser.email : ''}" type="email">
        </div>
        <div class="field">
          <label>Kata Sandi Baru (Opsional)</label>
          <input class="input" name="password" placeholder="Kosongkan jika tidak ingin mengubah sandi" type="password">
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 16px;">Simpan Perubahan</button>
      </form>

      <hr>
      <div class="profile-actions">
        <a class="btn btn-ghost" href="/daftar-tiket">Lihat Tiket Saya →</a>
        <form method="post" th:action="@{/logout}">
          <button class="btn btn-danger" type="submit">Keluar Akun</button>
        </form>
      </div>
    </section>
  </main>

  <nav aria-label="Navigasi bawah ponsel" class="bottom-nav">
    <a class="bottom-nav-item" href="/"><span class="bottom-nav-icon">⌂</span><span>Beranda</span></a>
    <a class="bottom-nav-item" href="/jelajah"><span class="bottom-nav-icon">🎬</span><span>Film</span></a>
    <a class="bottom-nav-item" href="/daftar-tiket"><span class="bottom-nav-icon">🎟</span><span>Tiket Saya</span></a>
    <a class="bottom-nav-item active" href="/profil"><span class="bottom-nav-icon">👤</span><span>Akun</span></a>
  </nav>

  <footer th:replace="~{fragments/public_footer :: publicFooter}"></footer>
</body>
</html>
